spring.application.name=call-center-system
spring.config.import=optional:file:./application-local.properties

# SQL Server credentials and connection details must be supplied externally.
spring.datasource.url=jdbc:sqlserver://${DB_SERVER:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:call_center_db};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# The application has no built-in account; provide credentials through a secret manager or environment.
app.security.username=${APP_SECURITY_USERNAME:}
app.security.password=${APP_SECURITY_PASSWORD:}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:true}

# HTTPS is enabled by default. Supply a PKCS#12 keystore and its password.
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
